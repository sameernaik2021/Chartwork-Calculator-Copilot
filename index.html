<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chartwork Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #003366;
    }
    .calculator {
      max-width: 600px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 20px;
      padding: 10px 15px;
      background: #003366;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0055aa;
    }
    .results {
      margin-top: 20px;
      padding: 15px;
      background: #e6f2ff;
      border-radius: 6px;
    }
    .results p {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <h1>Chartwork Calculator</h1>
  <div class="calculator">
    <label for="speed">Ship Speed (knots):</label>
    <input type="number" id="speed" placeholder="e.g. 12" step="0.1">

    <label for="course">Course (degrees):</label>
    <input type="number" id="course" placeholder="e.g. 90" step="0.1">

    <label for="time">Time (hours):</label>
    <input type="number" id="time" placeholder="e.g. 5" step="0.1">

    <label for="windDrift">Wind/Current Drift (knots):</label>
    <input type="number" id="windDrift" placeholder="e.g. 2" step="0.1">

    <label for="driftDir">Drift Direction (degrees):</label>
    <input type="number" id="driftDir" placeholder="e.g. 120" step="0.1">

    <button onclick="calculate()">Calculate</button>

    <div class="results" id="results"></div>
  </div>

  <script>
    function calculate() {
      const speed = parseFloat(document.getElementById('speed').value) || 0;
      const course = parseFloat(document.getElementById('course').value) || 0;
      const time = parseFloat(document.getElementById('time').value) || 0;
      const drift = parseFloat(document.getElementById('windDrift').value) || 0;
      const driftDir = parseFloat(document.getElementById('driftDir').value) || 0;

      // Distance traveled without drift
      const distance = speed * time;

      // Convert course and drift direction to radians
      const courseRad = course * Math.PI / 180;
      const driftRad = driftDir * Math.PI / 180;

      // Vector components
      const xShip = distance * Math.cos(courseRad);
      const yShip = distance * Math.sin(courseRad);

      const xDrift = drift * time * Math.cos(driftRad);
      const yDrift = drift * time * Math.sin(driftRad);

      // Resultant position
      const xTotal = xShip + xDrift;
      const yTotal = yShip + yDrift;

      const resultantDistance = Math.sqrt(xTotal**2 + yTotal**2);
      const resultantCourse = (Math.atan2(yTotal, xTotal) * 180 / Math.PI + 360) % 360;

      document.getElementById('results').innerHTML = `
        <p><strong>Distance (no drift):</strong> ${distance.toFixed(2)} nautical miles</p>
        <p><strong>Adjusted Distance:</strong> ${resultantDistance.toFixed(2)} nautical miles</p>
        <p><strong>Adjusted Course:</strong> ${resultantCourse.toFixed(2)}°</p>
        <p><strong>Position Shift (X,Y):</strong> (${xTotal.toFixed(2)}, ${yTotal.toFixed(2)}) nm</p>
      `;
    }
  </script>
</body>
</html>
